### APPLICATION ###
spring.application.name=applications-service
server.port=${SERVER_PORT:8089}

### SPRING CLOUD CONFIG (optional: enable when a Config Server is running) ###
spring.cloud.config.enabled=${CONFIG_ENABLED:false}

### DATABASE (MySQL) ###
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/platformestage?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

### EUREKA (optional: set EUREKA_ENABLED=true when a Eureka server is running) ###
eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.register-with-eureka=${EUREKA_ENABLED:false}
eureka.client.fetch-registry=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

### MAIL (credentials are provided through environment variables only) ###
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

### API DOCUMENTATION ###
springdoc.swagger-ui.path=/swagger-ui.html

### ACTUATOR ###
management.endpoints.web.exposure.include=health,info
